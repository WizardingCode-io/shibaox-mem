name: Traffic

# GitHub keeps clone counts for 14 days and shows them only to the repository's admins.
# Once a day this adds the days it reports to traffic.json on the `badges` branch and
# writes clones.json, the README badge's endpoint. Needs TRAFFIC_TOKEN: a fine-grained
# token for this repository with Administration (read) permission.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clones:
    runs-on: ubuntu-latest
    steps:
      - name: Count the clones
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No TRAFFIC_TOKEN secret; nothing to do."; exit 0; fi
          gh api "repos/$REPO/traffic/clones" > recent.json
      - uses: actions/checkout@v7
        if: hashFiles('recent.json') != ''
        with:
          ref: badges
          path: badges
      - name: Update the badge
        if: hashFiles('recent.json') != ''
        run: |
          cd badges
          [ -f traffic.json ] || echo '{"clones":{}}' > traffic.json
          jq --slurpfile recent ../recent.json '
            .clones += ($recent[0].clones | map({(.timestamp[0:10]): {count, uniques}}) | add // {})
          ' traffic.json > next.json
          mv next.json traffic.json
          total=$(jq '[.clones[].count] | add // 0' traffic.json)
          jq -n --arg n "$total" '{schemaVersion: 1, label: "clones", message: $n, color: "6B35E0", labelColor: "100E0D"}' > clones.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.json clones.json
          git diff --cached --quiet || git commit -m "Clones: $total"
          git push
